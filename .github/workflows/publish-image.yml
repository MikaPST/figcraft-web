name: Build and publish FigCraft Web

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Official upstream release tag (empty = latest)"
        required: false
        type: string
      force_rebuild:
        description: "Rebuild an already published release"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "nginx.conf"
      - ".dockerignore"
      - "docker-compose.yml"
      - "README.md"
      - ".github/workflows/publish-image.yml"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/mikapst/figcraft-web

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4
        with:
          path: packaging

      - name: Resolve official upstream release
        id: upstream-release
        uses: actions/github-script@v7
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        with:
          script: |
            const requested = (process.env.REQUESTED_TAG || '').trim();
            const repo = {owner:'storytold', repo:'figcraft'};
            const result = requested
              ? await github.rest.repos.getReleaseByTag({...repo, tag:requested})
              : await github.rest.repos.getLatestRelease(repo);
            const release = result.data;
            if (!release.tag_name) throw new Error('No official release tag');
            core.setOutput('tag',release.tag_name);
            core.setOutput('url',release.html_url);
            core.setOutput('body',release.body || '');
            core.setOutput('name',release.name || `FigCraft ${release.tag_name}`);
            core.setOutput('prerelease',String(release.prerelease));
            core.setOutput('published_at',release.published_at || '');

      - name: Check local release
        id: release-check
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.upstream-release.outputs.tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        with:
          script: |
            let exists=false;
            try {
              await github.rest.repos.getReleaseByTag({...context.repo,tag:process.env.TAG});
              exists=true;
            } catch(error) {
              if(error.status !== 404) throw error;
            }
            const forced=process.env.FORCE_REBUILD==='true'||context.eventName==='push';
            core.setOutput('skip',String(exists&&!forced));

      - name: Checkout official FigCraft release
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/figcraft
          ref: ${{ steps.upstream-release.outputs.tag }}
          path: upstream
          submodules: recursive

      - name: Checkout shared fonts
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: main
          path: craft-fonts

      - name: Record source commits
        if: steps.release-check.outputs.skip != 'true'
        id: source
        shell: bash
        run: |
          echo "short=$(git -C upstream rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "full=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "fonts=$(git -C craft-fonts rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.release-check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        run: cargo install trunk --locked

      - name: Validate upstream source and fonts
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        run: |
          test -f upstream/apps/figcraft-web/Trunk.toml
          test -f upstream/apps/figcraft-web/index.html
          test -f upstream/Cargo.lock
          test -f craft-fonts/fonts/manifest.txt
          test -f craft-fonts/fonts/latin-manifest.txt
          test -f upstream/LICENSE-MIT
          test -f upstream/LICENSE-APACHE

      - name: Build FigCraft WebAssembly application
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        working-directory: upstream/apps/figcraft-web
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: trunk build --release

      - name: Validate generated site and WASM size
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          SITE=upstream/dist/web
          test -s "$SITE/index.html"
          find "$SITE" -maxdepth 1 -name '*.js' -type f | grep -q .
          find "$SITE" -maxdepth 1 -name '*.wasm' -type f | grep -q .
          if grep -Eq '(src|href)="/[^/]' "$SITE/index.html"; then
            echo "::error::Root-absolute asset URLs break subpath hosting"
            exit 1
          fi
          for file in "$SITE"/*.wasm; do
            size=$(wc -c < "$file")
            echo "$(basename "$file"): $size bytes"
            if (( size > 26214400 )); then
              echo "::error::WASM exceeds upstream 25 MiB distribution limit"
              exit 1
            fi
          done

      - name: Prepare temporary Docker build context
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker-context/site docker-context/legal
          cp -a upstream/dist/web/. docker-context/site/
          cp packaging/Dockerfile packaging/nginx.conf packaging/.dockerignore docker-context/
          for file in LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md ASSETS.md; do
            if [[ -f "upstream/$file" ]]; then cp "upstream/$file" docker-context/legal/; fi
          done
          if [[ -d upstream/licenses ]]; then
            cp -a upstream/licenses docker-context/legal/upstream-licenses
          fi
          find craft-fonts -type f \( -iname '*license*' -o -iname '*ofl*' -o -iname '*notice*' \) -print0 |
            while IFS= read -r -d '' file; do
              relative="${file#craft-fonts/}"
              mkdir -p "docker-context/legal/craft-fonts/$(dirname "$relative")"
              cp "$file" "docker-context/legal/craft-fonts/$relative"
            done
          test -s docker-context/site/index.html
          test -f docker-context/Dockerfile

      - name: Set up QEMU
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        if: steps.release-check.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.upstream-release.outputs.tag }}
            type=raw,value=upstream-${{ steps.source.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/MikaPST/figcraft-web
            org.opencontainers.image.revision=${{ steps.source.outputs.full }}
            org.opencontainers.image.version=${{ steps.upstream-release.outputs.tag }}
            org.opencontainers.image.description=Independent Docker packaging for FigCraft Web

      - name: Build and push multi-platform image
        if: steps.release-check.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create or update matching GitHub Release
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.upstream-release.outputs.tag }}
          RELEASE_NAME: ${{ steps.upstream-release.outputs.name }}
          RELEASE_URL: ${{ steps.upstream-release.outputs.url }}
          RELEASE_NOTES: ${{ steps.upstream-release.outputs.body }}
          RELEASE_PRERELEASE: ${{ steps.upstream-release.outputs.prerelease }}
          RELEASE_PUBLISHED_AT: ${{ steps.upstream-release.outputs.published_at }}
          RELEASE_SOURCE_SHA: ${{ steps.source.outputs.short }}
          RELEASE_FONTS_SHA: ${{ steps.source.outputs.fonts }}
          RELEASE_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const tag=process.env.RELEASE_TAG;
            const image='ghcr.io/mikapst/figcraft-web';
            const body=[
              `Community-maintained Docker packaging for **${process.env.RELEASE_NAME}**.`,
              '',
              '## Docker image',
              `- \`${image}:latest\``,
              `- \`${image}:${tag}\``,
              `- \`${image}:upstream-${process.env.RELEASE_SOURCE_SHA}\``,
              '',
              'Platforms: `linux/amd64`, `linux/arm64`.',
              `Docker manifest digest: \`${process.env.RELEASE_DIGEST || 'not reported'}\``,
              '',
              `Official upstream release: ${process.env.RELEASE_URL}`,
              `Upstream publication date: ${process.env.RELEASE_PUBLISHED_AT || 'not specified'}`,
              `Upstream source commit: \`${process.env.RELEASE_SOURCE_SHA}\``,
              `Shared fonts commit: \`${process.env.RELEASE_FONTS_SHA}\``,
              '',
              '## Official upstream release notes',
              process.env.RELEASE_NOTES || 'No upstream release notes provided.',
              '',
              'This is independent Docker packaging, not an official upstream distribution.'
            ].join('\n');
            let existing;
            try {
              existing=(await github.rest.repos.getReleaseByTag({...context.repo,tag})).data;
            } catch(error) {
              if(error.status !== 404) throw error;
            }
            const args={...context.repo,name:`FigCraft Web ${tag}`,body,
              draft:false,prerelease:process.env.RELEASE_PRERELEASE==='true'};
            if(existing) {
              await github.rest.repos.updateRelease({...args,release_id:existing.id});
            } else {
              await github.rest.repos.createRelease({...args,tag_name:tag,target_commitish:context.sha});
            }
